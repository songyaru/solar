<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>太阳系演示 · Solar System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #030308;
      --ink: #e8eef8;
      --muted: #8b9bb4;
      --hud: #5eebff;
      --hud-dim: rgba(94, 235, 255, 0.35);
      --panel: rgba(8, 12, 24, 0.72);
      --line: rgba(94, 235, 255, 0.18);
      --danger: #ff7a6a;
      --r: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #app { position: relative; width: 100%; height: 100%; }
    #scene { position: absolute; inset: 0; display: block; cursor: grab; }
    #scene.dragging { cursor: grabbing; }
    #scene.hovering { cursor: pointer; }

    .glass {
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    /* Top bar */
    .topbar {
      position: absolute;
      top: 18px;
      left: 20px;
      right: 20px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
      z-index: 10;
    }
    .brand {
      pointer-events: auto;
      padding: 12px 16px;
      border-radius: var(--r);
      min-width: 220px;
    }
    .brand h1 {
      font-family: "Space Grotesk", "PingFang SC", system-ui, sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.04em;
      line-height: 1.2;
    }
    .brand p {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
    }
    .hints {
      pointer-events: auto;
      padding: 10px 14px;
      border-radius: var(--r);
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7;
      text-align: right;
    }
    .hints kbd {
      display: inline-block;
      padding: 1px 6px;
      margin: 0 2px;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
    }

    /* Info panel */
    .panel {
      position: absolute;
      top: 96px;
      right: 20px;
      width: 340px;
      max-height: calc(100vh - 180px);
      border-radius: var(--r);
      padding: 18px 18px 16px;
      z-index: 12;
      overflow: auto;
      transform: translateX(16px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease, transform 0.28s ease;
    }
    .panel.open {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }
    .panel::-webkit-scrollbar { width: 6px; }
    .panel::-webkit-scrollbar-thumb {
      background: rgba(94, 235, 255, 0.25);
      border-radius: 3px;
    }

    .panel-eyebrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .panel-eyebrow span {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      color: var(--hud);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    /* Desktop never shows the mobile “tap to expand” hint */
    .panel-hint { display: none !important; }
    .close-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      display: grid;
      place-items: center;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .close-btn:hover {
      color: var(--ink);
      border-color: var(--hud-dim);
      background: rgba(94, 235, 255, 0.08);
    }

    .planet-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }
    .planet-swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      box-shadow: 0 0 12px currentColor;
      flex-shrink: 0;
    }
    .planet-head h2 {
      font-family: "Space Grotesk", "PingFang SC", system-ui, sans-serif;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .planet-en {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
    }
    .planet-desc {
      font-size: 13px;
      line-height: 1.65;
      color: rgba(232, 238, 248, 0.88);
      margin-bottom: 14px;
    }
    .tagline {
      margin: 0 0 10px;
      font-size: 13px;
      color: var(--hud);
      font-weight: 500;
    }
    .section-label {
      margin: 14px 0 8px;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      text-transform: uppercase;
    }
    .compare-box {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.55;
      color: rgba(232, 238, 248, 0.92);
      background: rgba(94, 235, 255, 0.06);
      border: 1px solid rgba(94, 235, 255, 0.18);
    }
    .fun-facts {
      list-style: none;
      margin: 0 0 8px;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .fun-facts li {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      font-size: 12.5px;
      line-height: 1.55;
      color: rgba(232, 238, 248, 0.9);
    }
    .ff-i {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      margin-top: 1px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 10px;
      font-weight: 600;
      color: #031018;
      background: var(--hud);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat {
      padding: 10px 11px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .stat dt {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .stat dd {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 13px;
      color: var(--ink);
      font-weight: 500;
    }
    .badge {
      display: inline-block;
      margin-top: 12px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      color: var(--hud);
      background: rgba(94, 235, 255, 0.08);
      border: 1px solid rgba(94, 235, 255, 0.22);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
    }

    /* Bottom controls */
    .dock {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 16px;
      z-index: 12;
      max-width: calc(100vw - 32px);
      flex-wrap: nowrap;
      justify-content: center;
      overflow: hidden;
    }
    .dock button {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
      color: var(--ink);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .dock button:hover {
      background: rgba(94, 235, 255, 0.1);
      border-color: var(--hud-dim);
    }
    .dock button.active {
      color: #031018;
      background: var(--hud);
      border-color: var(--hud);
    }
    .dock .slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px 4px 12px;
      min-width: 0;
      flex: 1 1 auto;
    }
    .dock label {
      font-size: 11px;
      color: var(--muted);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      white-space: nowrap;
    }
    .dock input[type="range"] {
      width: 100px;
      min-width: 48px;
      accent-color: var(--hud);
      cursor: pointer;
      flex: 1 1 auto;
    }
    #speedVal {
      min-width: 36px;
      text-align: right;
      color: var(--hud);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12px;
    }

    /* Hover tooltip */
    #tooltip {
      position: absolute;
      pointer-events: none;
      z-index: 20;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink);
      background: rgba(8, 12, 24, 0.88);
      border: 1px solid var(--hud-dim);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      transform: translate(-50%, -140%);
      opacity: 0;
      transition: opacity 0.12s ease;
      white-space: nowrap;
    }
    #tooltip.show { opacity: 1; }

    /* Planet quick nav */
    .planet-nav {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 11;
      padding: 10px 8px;
      border-radius: 14px;
    }
    .planet-nav button {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }
    .planet-nav button:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--line);
      transform: scale(1.06);
    }
    .planet-nav button.active {
      border-color: var(--hud-dim);
      background: rgba(94, 235, 255, 0.1);
    }
    .planet-nav .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      box-shadow: 0 0 8px currentColor;
      background-size: 220% 100%;
      background-position: 35% center;
      background-repeat: no-repeat;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Loading */
    #loader {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
      z-index: 50;
      transition: opacity 0.4s ease;
    }
    #loader.hide {
      opacity: 0;
      pointer-events: none;
    }
    #loader .ring {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid rgba(94, 235, 255, 0.15);
      border-top-color: var(--hud);
      animation: spin 0.9s linear infinite;
    }
    #loader p {
      margin-top: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.12em;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Mobile / portrait */
    @media (max-width: 820px) {
      .hints { display: none; }

      .topbar {
        top: max(10px, env(safe-area-inset-top));
        left: 10px;
        right: 10px;
      }
      .brand {
        min-width: 0;
        padding: 8px 12px;
      }
      .brand h1 { font-size: 15px; }
      .brand p { font-size: 10px; margin-top: 2px; }

      /* Bottom stack: dock → planet nav → panel. Explicit heights so nothing overlaps. */
      :root {
        --dock-h: 44px;
        --nav-h: 52px;
        --stack-gap: 8px;
        --safe-bottom: max(6px, env(safe-area-inset-bottom));
        --nav-bottom: calc(var(--safe-bottom) + var(--dock-h) + var(--stack-gap));
        --panel-bottom: calc(var(--safe-bottom) + var(--dock-h) + var(--nav-h) + var(--stack-gap) * 2);
      }

      /* Horizontal planet strip */
      .planet-nav {
        display: flex;
        flex-direction: row;
        left: 8px;
        right: 8px;
        top: auto;
        bottom: var(--nav-bottom);
        transform: none;
        overflow-x: auto;
        overflow-y: hidden;
        gap: 4px;
        padding: 6px 8px;
        height: var(--nav-h);
        box-sizing: border-box;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        max-width: none;
        z-index: 11;
      }
      .planet-nav::-webkit-scrollbar { display: none; }
      .planet-nav button {
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
      }
      .planet-nav .dot {
        width: 22px;
        height: 22px;
      }

      /* Card matches dock/nav width, border, and strip height */
      .panel {
        left: 8px;
        right: 8px;
        width: auto;
        top: auto;
        bottom: var(--panel-bottom);
        max-height: min(38vh, 300px);
        border-radius: 12px;
        border: 1px solid var(--line);
        padding: 10px 12px 12px;
        transform: translateY(12px);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
        background: rgba(6, 10, 20, 0.52);
        backdrop-filter: blur(22px) saturate(165%);
        -webkit-backdrop-filter: blur(22px) saturate(165%);
        z-index: 12;
        box-sizing: border-box;
      }
      .panel.open { transform: translateY(0); }
      /* Collapsed strips share dock height so the three bars look like one stack */
      .panel[data-mode="overview"],
      .panel[data-mode="detail"].minimized {
        max-height: var(--dock-h);
        height: var(--dock-h);
        padding: 0 12px;
        overflow: hidden;
        display: flex;
        align-items: center;
      }
      .panel[data-mode="overview"] .panel-eyebrow,
      .panel[data-mode="detail"].minimized .panel-eyebrow {
        margin: 0;
        width: 100%;
      }
      .panel[data-mode="detail"].minimized #panelBody {
        display: none;
      }
      .panel[data-mode="detail"] .panel-eyebrow {
        cursor: pointer;
      }
      .planet-head h2 { font-size: 22px; }
      .stats { grid-template-columns: 1fr 1fr; gap: 6px; }
      .stat { padding: 8px 10px; }
      .stat dd { font-size: 12px; }
      .fun-facts li { font-size: 12px; }
      .compare-box { font-size: 12px; }
      #panelBody .badge-hint { display: none; }

      .dock {
        left: 8px;
        right: 8px;
        bottom: var(--safe-bottom);
        transform: none;
        width: auto;
        max-width: none;
        gap: 4px;
        padding: 5px 6px;
        min-height: var(--dock-h);
        box-sizing: border-box;
        border-radius: 12px;
        justify-content: space-between;
        z-index: 13;
      }
      .dock button {
        padding: 6px 8px;
        min-height: 32px;
        font-size: 11px;
        border-radius: 8px;
      }
      .dock .slider-wrap {
        min-width: 0;
        flex: 1;
        gap: 4px;
        padding: 0 4px;
      }
      .dock input[type="range"] {
        width: 100%;
        min-width: 40px;
        height: 22px;
      }
      #speedVal { min-width: 28px; font-size: 10px; }
      .dock label { font-size: 10px; }

      /* Overview default-collapsed strip (mobile only) */
      .panel[data-mode="overview"] .panel-eyebrow {
        margin-bottom: 0;
      }
      .panel[data-mode="overview"] #panelBody {
        display: none;
      }
      .panel[data-mode="overview"].expanded {
        max-height: min(38vh, 300px);
        height: auto;
        padding: 12px 14px 14px;
        overflow-y: auto;
        display: block;
      }
      .panel[data-mode="overview"].expanded #panelBody {
        display: block;
      }
      .panel[data-mode="overview"].expanded .panel-eyebrow {
        margin-bottom: 10px;
        width: auto;
      }
      .panel[data-mode="overview"] .panel-eyebrow span {
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: none;
      }
      .panel[data-mode="overview"] .close-btn {
        font-size: 14px;
        line-height: 1;
      }
    }

    /* Desktop overview has no close action */
    @media (min-width: 821px) {
      .panel[data-mode="overview"] .close-btn {
        display: none;
      }
    }

    /* Extra-narrow phones: compact dock labels */
    @media (max-width: 380px) {
      .dock button { padding: 6px 6px; font-size: 10px; }
      .planet-nav button { width: 34px; height: 34px; }
    }

    /* Narrow window: keep dock on one line */
    @media (max-width: 720px) {
      .dock {
        gap: 6px;
        padding: 8px 10px;
        flex-wrap: nowrap;
      }
      .dock label { display: none; }
      .dock .slider-wrap { min-width: 0; padding: 0 4px; }
      .dock input[type="range"] { min-width: 56px; width: 80px; }
      #speedVal { min-width: 32px; }
    }

    /* Landscape phone: keep side panel but tighter */
    @media (max-width: 920px) and (max-height: 480px) and (orientation: landscape) {
      .panel {
        width: 280px;
        max-height: calc(100vh - 90px);
        top: 70px;
        bottom: auto;
      }
      .planet-nav { display: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <div id="loader">
      <div>
        <div class="ring"></div>
        <p>INITIALIZING ORBITAL MODEL</p>
      </div>
    </div>

    <header class="topbar">
      <div class="brand glass">
        <h1>太阳系演示</h1>
        <p>Solar System · Nine Planets</p>
      </div>
      <div class="hints glass">
        拖拽旋转 · 滚轮缩放 · 点击行星查看详情<br />
        <kbd>Space</kbd> 暂停 · <kbd>R</kbd> 重置视角 · <kbd>Esc</kbd> 关闭面板
      </div>
    </header>

    <nav class="planet-nav glass" id="planetNav" aria-label="行星快捷导航"></nav>

    <aside class="panel glass" id="infoPanel" aria-live="polite">
      <div class="panel-eyebrow">
        <span id="panelEyebrow">OVERVIEW</span>
        <button class="close-btn" id="closePanel" title="关闭" aria-label="关闭或收起">×</button>
      </div>
      <div id="panelBody"></div>
    </aside>

    <div class="dock glass">
      <button id="btnPause" type="button">暂停</button>
      <button id="btnOrbits" type="button" class="active">轨道</button>
      <button id="btnLabels" type="button">标签</button>
      <button id="btnReset" type="button">重置视角</button>
      <div class="slider-wrap">
        <label for="speed">时间</label>
        <input id="speed" type="range" min="0" max="100" value="50" />
        <span id="speedVal">1.0×</span>
      </div>
    </div>

    <div id="tooltip"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ---------- Planet catalog (compressed scene scale, real facts) ----------
    // orbit: scene units | size: scene radius | period: relative earth-years | day: relative earth-days
    // kid:科普向文案 — nickname / tagline / funFacts / compare
    const PLANETS = [
      {
        id: 'sun',
        name: '太阳',
        en: 'Sun',
        type: '恒星',
        color: 0xffb347,
        glow: 0xffcc66,
        orbit: 0,
        size: 2.45,
        period: 0,
        day: 0,
        tilt: 0,
        ring: false,
        nickname: '太阳系的大家长',
        tagline: '一颗会自己发光发热的大火球',
        desc: '太阳不是一颗“石头球”，而是一颗巨大的恒星。它靠里面的核聚变“烧”氢气，变成氦气，同时放出光和热。行星们都围着它转，就像孩子围着妈妈。',
        facts: {
          '直径': '约 139 万公里',
          '表面温度': '约 5,500 °C',
          '核心温度': '约 1,500 万 °C',
          '占系统质量': '99.86%',
          '光到地球': '约 8 分 20 秒',
          '年龄': '约 46 亿年'
        },
        funFacts: [
          '太阳非常大，大约可以装下 100 万个地球。',
          '你现在看到的阳光，是 8 分多钟前从太阳出发的。',
          '太阳表面有“太阳黑子”，其实是相对凉快一点的斑点。'
        ],
        compare: '如果太阳是篮球，地球大约只有一粒芝麻那么大。'
      },
      {
        id: 'mercury',

    function makeStars(count, radius, size, opacity) {
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);

      for (let i = 0; i < count; i++) {
        const u = Math.random();
        const v = Math.random();
        const theta = 2 * Math.PI * u;
        const phi = Math.acos(2 * v - 1);
        const r = radius * (0.75 + Math.random() * 0.25);
        pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        pos[i * 3 + 2] = r * Math.cos(phi);
        const t = Math.random();
        const c = new THREE.Color().setHSL(0.55 + t * 0.15, 0.15 + t * 0.25, 0.8 + t * 0.2);
        col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

    // ---------- Procedural textures ----------
    function noise2(x, y, seed = 1) {
      const n = Math.sin(x * 12.9898 + y * 78.233 + seed * 4.1) * 43758.5453;
      return n - Math.floor(n);
    }
    function smoothNoise(x, y, seed = 1) {
      const x0 = Math.floor(x), y0 = Math.floor(y);
      const fx = x - x0, fy = y - y0;
      const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      const n00 = noise2(x0, y0, seed), n10 = noise2(x0 + 1, y0, seed);
      const n01 = noise2(x0, y0 + 1, seed), n11 = noise2(x0 + 1, y0 + 1, seed);
      return n00 * (1 - sx) * (1 - sy) + n10 * sx * (1 - sy) + n01 * (1 - sx) * sy + n11 * sx * sy;
    }
    function fbm(x, y, octaves = 4, seed = 1) {
      let v = 0, a = 0.5, f = 1;
      for (let i = 0; i < octaves; i++) {
        v += a * smoothNoise(x * f, y * f, seed + i);
        f *= 2;
        a *= 0.5;
      }
      return v;
    }

    function makePlanetTexture(baseHex, style = 'rock', seed = 1) {
      const size = 512;

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const i = (y * size + x) * 4;
          let r = base.r, g = base.g, b = base.b;

          if (style === 'gas' || style === 'bands') {
            // Latitude bands + longitude streaks so spin is obvious
            const nx = x / size, ny = y / size;
            const lat = Math.sin(ny * Math.PI * 14 + Math.sin(nx * 6 + seed) * 0.8);
            const lat2 = Math.sin(ny * Math.PI * 7 + seed);
            const streak = fbm(nx * 6, ny * 28, 4, seed + 2) - 0.5;
            const light = 0.55 + lat * 0.28 + lat2 * 0.16 + streak * 0.35;
            r = Math.max(0, r * light);
            g = Math.max(0, g * light);
            b = Math.max(0, b * light);
            // bright zones
            if (lat > 0.55) {
              r = Math.min(1, r * 1.25 + 0.12);
              g = Math.min(1, g * 1.25 + 0.1);
              b = Math.min(1, b * 1.2 + 0.08);
            }
            // dark belts
            if (lat < -0.5) {
              r *= 0.55; g *= 0.5; b *= 0.5;
            }
            // Longitudinal storms (visible rotation)
            for (let s = 0; s < 4; s++) {
              const sx = ((seed * 0.17 + s * 0.27) % 1) * size;
              const sy = size * (0.32 + s * 0.12);
              const dx = (x - sx) / (40 + s * 10);
              const dy = (y - sy) / (16 + s * 5);
              const d = dx * dx + dy * dy;
              if (d < 1) {
                const t = 1 - d;
                const cr = [0.9, 0.25, 0.95, 0.2][s];
                const cg = [0.28, 0.45, 0.9, 0.55][s];
                const cb = [0.12, 0.85, 0.75, 0.9][s];
                r = r * (1 - t * 0.85) + cr * t * 0.85;
                g = g * (1 - t * 0.85) + cg * t * 0.85;
                b = b * (1 - t * 0.85) + cb * t * 0.85;
              }
            }
            // longitudinal dark streaks for spin tracking
            const streak2 = Math.sin(nx * Math.PI * 20 + ny * 3 + seed);
            if (streak2 > 0.75) {
              r *= 0.45; g *= 0.4; b *= 0.4;
            }
          } else if (style === 'ice') {
            const n = fbm(x * 0.014, y * 0.014, 3, seed);
            const streak = fbm(x * 0.004, y * 0.04, 3, seed + 1);
            const light = 0.78 + n * 0.22 + streak * 0.2;
            r *= light; g *= light; b *= light;
            // polar caps hint + equator
            if (Math.abs(y - size * 0.5) < 4) {
              r = Math.min(1, r * 0.55 + 0.25);
              g = Math.min(1, g * 0.55 + 0.4);
              b = Math.min(1, b * 0.55 + 0.45);
            }
            if (y < size * 0.08 || y > size * 0.92) {
              r = Math.min(1, r + 0.2); g = Math.min(1, g + 0.2); b = Math.min(1, b + 0.25);
            }
          } else if (style === 'earth') {
            const n = fbm(x * 0.01, y * 0.01, 5, seed);
            const land = smoothNoise(x * 0.007, y * 0.009, seed + 9);
            if (land > 0.5) {

              r = r * (1 - gmix) + 0.16 * gmix;

            const cloud = fbm(x * 0.018, y * 0.014, 4, seed + 3);

              g = g * (1 - t) + t;
              b = b * (1 - t) + t;

            r *= light; g *= light; b *= light;

            const cx = noise2(Math.floor(x / 14), Math.floor(y / 14), seed);
            if (cx > 0.78) {
              const lx = (x % 14) / 14 - 0.5;
              const ly = (y % 14) / 14 - 0.5;
              const d = lx * lx + ly * ly;
              if (d < 0.08) {
                const t = 1 - d / 0.08;
                r *= 1 - t * 0.55;
                g *= 1 - t * 0.55;
                b *= 1 - t * 0.55;
              } else if (d < 0.14) {
                r = Math.min(1, r * 1.15);
                g = Math.min(1, g * 1.15);
                b = Math.min(1, b * 1.15);
              }
            }
            if (Math.abs(y - size * 0.5) < 2) {
              r = Math.min(1, r * 0.65 + 0.25);
              g = Math.min(1, g * 0.65 + 0.18);
              b = Math.min(1, b * 0.65 + 0.12);
            }
          }

          img.data[i] = Math.min(255, Math.max(0, r * 255));
          img.data[i + 1] = Math.min(255, Math.max(0, g * 255));
          img.data[i + 2] = Math.min(255, Math.max(0, b * 255));
          img.data[i + 3] = 255;

      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = THREE.RepeatWrapping;

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);

      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();

    // Soften equirect poles — SphereGeometry pinches UVs at the poles into a radial streak
    function softenPolarRows(image, { fade = 0.045, mode = 'blend' } = {}) {
      if (!image || !image.width || !image.height) return null;
      const w = image.width;
      const h = image.height;
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(image, 0, 0);
      const img = ctx.getImageData(0, 0, w, h);
      const data = img.data;
      const rows = Math.max(3, Math.floor(h * fade));
      const band = Math.max(2, Math.floor(h * 0.02));

      for (let edge = 0; edge < 2; edge++) {
        const yStart = edge === 0 ? 0 : h - rows;
        // average a safe latitude band just outside the fade zone
        const srcY0 = edge === 0 ? rows : h - rows - band;
        for (let y = 0; y < rows; y++) {
          const t = edge === 0
            ? 1 - y / rows
            : 1 - (rows - 1 - y) / rows;
          const yy = yStart + y;
          for (let x = 0; x < w; x++) {
            const i = (yy * w + x) * 4;
            let r = 0, g = 0, b = 0;
            for (let s = 0; s < band; s++) {
              const sy = edge === 0 ? srcY0 + s : srcY0 + s;
              const j = ((srcY0 + s) * w + x) * 4;
              r += data[j]; g += data[j + 1]; b += data[j + 2];
            }
            r /= band; g /= band; b /= band;
            if (mode === 'darken') {
              const k = 1 - t * 0.95;
              data[i] *= k; data[i + 1] *= k; data[i + 2] *= k;
            } else {
              // stronger blend toward mid-latitude average so bright ice caps don't form a hard crown
              const k = t * 0.92;
              data[i]     = data[i]     * (1 - k) + r * k;
              data[i + 1] = data[i + 1] * (1 - k) + g * k;
              data[i + 2] = data[i + 2] * (1 - k) + b * k;
            }
          }
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return tex;
    }

    function loadTexture(url, { srgb = true, wrapS = false } = {}) {
      return new Promise((resolve) => {
        texLoader.load(
          url,
          (tex) => {
            if (srgb) tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            if (wrapS) tex.wrapS = THREE.RepeatWrapping;
            resolve(tex);
          },
          undefined,
          () => {
            console.warn('texture failed, fallback:', url);
            resolve(null);
          }
        );
      });
    }

    async function loadAllTextures() {
      const entries = Object.entries(TEX);
      let done = 0;
      await Promise.all(entries.map(async ([key, url]) => {
        textures[key] = await loadTexture(url, { srgb: key !== 'saturnRing', wrapS: key === 'saturnRing' });
        done += 1;
        const el = document.querySelector('#loader p');
        if (el) el.textContent = `LOADING TEXTURES ${done}/${entries.length}`;
      }));

      // Pole cleanup on equirect planet maps (skip sky, rings)
      const planetKeys = ['sun', 'mercury', 'venus', 'earth', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune', 'pluto', 'moon'];
      for (const key of planetKeys) {
        const t = textures[key];
        if (!t || !t.image) continue;
        // Mars/Earth/Pluto have bright polar ice — fade more
        const fade = (key === 'mars' || key === 'earth' || key === 'pluto') ? 0.09
          : (key === 'saturn' || key === 'jupiter' || key === 'uranus' || key === 'neptune') ? 0.07
          : 0.05;
        const softened = softenPolarRows(t.image, { fade, mode: 'blend' });
        if (softened) textures[key] = softened;
      }
      if (textures.earthClouds?.image) {
        const softened = softenPolarRows(textures.earthClouds.image, { fade: 0.07, mode: 'darken' });
        if (softened) textures.earthClouds = softened;
      }
    }

    // ---------- Build solar system ----------
    const system = new THREE.Group();
    scene.add(system);

    const pickables = [];
    const bodies = new Map(); // id -> body object
    let showOrbits = true;
    let showLabels = false;
    let selectedId = null;
    let hoveredId = null;
    let paused = false;
    let timeScale = 1.0;
    let simTime = 0;
    const bodyMeshExtras = {};
    const bodyMoons = []; // { pivot, speed }

    // Sun
    const sunData = PLANETS[0];
    await loadAllTextures();
    buildSkybox();
    const sunGeo = new THREE.SphereGeometry(sunData.size, 96, 96);
    const sunMat = new THREE.MeshBasicMaterial({
      map: textures.sun || makeSunTexture()
    });
    const sunMesh = new THREE.Mesh(sunGeo, sunMat);
    sunMesh.userData.id = 'sun';
    system.add(sunMesh);
    pickables.push(sunMesh);

    // Sun corona glow
    const coronaGeo = new THREE.SphereGeometry(sunData.size * 1.22, 32, 32);
    const coronaMat = new THREE.MeshBasicMaterial({
      color: 0xffaa33,
      transparent: true,
      opacity: 0.14,
      side: THREE.BackSide,
      depthWrite: false
    });
    system.add(new THREE.Mesh(coronaGeo, coronaMat));
    const haloGeo = new THREE.SphereGeometry(sunData.size * 1.55, 32, 32);
    const haloMat = new THREE.MeshBasicMaterial({
      color: 0xff6622,
      transparent: true,
      opacity: 0.07,
      side: THREE.BackSide,
      depthWrite: false
    });
    system.add(new THREE.Mesh(haloGeo, haloMat));

    const sunLabel = makeLabelSprite('太阳');
    sunLabel.position.set(0, sunData.size + 1.2, 0);
    system.add(sunLabel);

    bodies.set('sun', {
      data: sunData,
      mesh: sunMesh,
      group: system,
      pivot: null,
      label: sunLabel,
      angle: 0
    });

    // Planets
    const styles = {
      mercury: 'rock',
      venus: 'rock',
      earth: 'earth',
      mars: 'rock',
      jupiter: 'gas',
      saturn: 'gas',
      uranus: 'ice',
      neptune: 'ice',
      pluto: 'rock'
    };
    const seeds = {
      mercury: 2, venus: 4, earth: 7, mars: 11,
      jupiter: 15, saturn: 21, uranus: 28, neptune: 33, pluto: 40
    };

    for (const p of PLANETS.slice(1)) {
      const pivot = new THREE.Group();
      system.add(pivot);

      // Orbit path
      const curve = new THREE.EllipseCurve(0, 0, p.orbit, p.orbit, 0, Math.PI * 2, false, 0);
      const pts = curve.getPoints(160).map(pt => new THREE.Vector3(pt.x, 0, pt.y));
      const orbitGeo = new THREE.BufferGeometry().setFromPoints(pts);
      const orbitMat = new THREE.LineBasicMaterial({
        color: 0x4a5d82,
        transparent: true,
        opacity: 0.7
      });
      const orbitLine = new THREE.LineLoop(orbitGeo, orbitMat);
      pivot.add(orbitLine);

      // Planet holder (position on orbit)
      const holder = new THREE.Group();
      holder.position.x = p.orbit;
      pivot.add(holder);

      // Axial tilt lives on a parent so mesh.rotation.y = real spin
      const tiltGroup = new THREE.Group();
      tiltGroup.rotation.z = THREE.MathUtils.degToRad(p.tilt);
      holder.add(tiltGroup);

      const tex = textures[p.id] || makePlanetTexture(p.color, styles[p.id] || 'rock', seeds[p.id] || 1);
      const isGiant = styles[p.id] === 'gas' || styles[p.id] === 'ice';
      const mat = new THREE.MeshStandardMaterial({
        map: tex,
        roughness: 0.95,
        metalness: 0.0,
        emissiveMap: tex,
        emissive: new THREE.Color(0xffffff),
        // Earth keeps a bit less glow so clouds/surface stay readable as solid layers
        emissiveIntensity: isGiant ? 0.55 : (p.id === 'earth' ? 0.22 : 0.38),
        envMapIntensity: 0
      });
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(p.size, 96, 96), mat);
      mesh.userData.id = p.id;
      tiltGroup.add(mesh);
      pickables.push(mesh);

      // Earth cloud shell — alphaMap so clear sky is truly transparent
      let cloudMesh = null;
      if (p.id === 'earth' && textures.earthClouds) {
        const cloudTex = textures.earthClouds;
        cloudTex.wrapS = THREE.RepeatWrapping;
        cloudMesh = new THREE.Mesh(
          new THREE.SphereGeometry(p.size * 1.012, 64, 64),
          new THREE.MeshStandardMaterial({
            color: 0xffffff,
            alphaMap: cloudTex,
            transparent: true,
            opacity: 0.92,
            depthWrite: false,
            roughness: 1,
            metalness: 0,
            // keep clouds lit by the same sun light as the surface
            emissive: 0xffffff,
            emissiveIntensity: 0.08,
            emissiveMap: cloudTex
          })
        );
        cloudMesh.userData.id = 'earth';
        cloudMesh.renderOrder = 1;
        tiltGroup.add(cloudMesh);
        bodyMeshExtras.earthClouds = cloudMesh;
      }

      // Invisible slightly enlarged hit target (keep close to visual size so moons stay clickable)
      const hit = new THREE.Mesh(
        new THREE.SphereGeometry(p.size * 1.08, 16, 16),
        new THREE.MeshBasicMaterial({ visible: false })
      );
      hit.userData.id = p.id;
      holder.add(hit);
      pickables.push(hit);

      // Spin axis indicator (visible for selected / larger bodies)
      const axisLen = p.size * 1.7;
      const axisGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, -axisLen, 0),
        new THREE.Vector3(0, axisLen, 0)
      ]);
      const axisLine = new THREE.Line(
        axisGeo,
        new THREE.LineBasicMaterial({ color: 0x5eebff, transparent: true, opacity: 0 })
      );
      tiltGroup.add(axisLine);

      // Selection ring intentionally omitted — orbit highlight + panel are enough
      const selRing = null;

      // Saturn rings
      if (p.ring) {
        const inner = p.size * 1.35;
        const outer = p.size * 2.35;
        const ringGeo = new THREE.RingGeometry(inner, outer, 96);
        // UV fix for ring texture gradient
        const posAttr = ringGeo.attributes.position;
        const uvAttr = ringGeo.attributes.uv;
        const v3 = new THREE.Vector3();
        for (let i = 0; i < posAttr.count; i++) {
          v3.fromBufferAttribute(posAttr, i);
          const r = Math.sqrt(v3.x * v3.x + v3.y * v3.y);
          const t = (r - inner) / (outer - inner);
          uvAttr.setXY(i, t, 0);
        }
        const ringMat = new THREE.MeshStandardMaterial({
          map: textures.saturnRing || null,
          alphaMap: textures.saturnRing || null,
          color: textures.saturnRing ? 0xffffff : 0xd4c4a0,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.95,
          roughness: 0.9,
          metalness: 0.0,
          depthWrite: false,
          alphaTest: 0.02
        });
        if (!textures.saturnRing) {
          // fallback: simple radial gradient canvas
          const rc = document.createElement('canvas');
          rc.width = 256; rc.height = 4;
          const rctx = rc.getContext('2d');
          const grd = rctx.createLinearGradient(0, 0, 256, 0);
          grd.addColorStop(0, 'rgba(200,180,140,0.2)');
          grd.addColorStop(0.25, 'rgba(230,210,170,0.95)');
          grd.addColorStop(0.45, 'rgba(40,30,20,0.15)');
          grd.addColorStop(0.65, 'rgba(210,190,150,0.85)');
          grd.addColorStop(1, 'rgba(180,160,130,0.05)');
          rctx.fillStyle = grd;
          rctx.fillRect(0, 0, 256, 4);
          const rt = new THREE.CanvasTexture(rc);
          rt.colorSpace = THREE.SRGBColorSpace;
          ringMat.map = rt;
          ringMat.color.set(0xffffff);
        }
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2.3;
        ring.rotation.z = THREE.MathUtils.degToRad(8);
        tiltGroup.add(ring);
      }

      // Major moons (orbit around planet, pickable → parent planet panel)
      const moonList = MOONS[p.id] || [];
      for (const m of moonList) {
        const moonPivot = new THREE.Group();
        holder.add(moonPivot);
        moonPivot.rotation.y = (m.id.charCodeAt(0) * 0.7 + m.dist) % (Math.PI * 2);

        const moonTex = m.useMoonTex ? textures.moon : null;
        const moonMesh = new THREE.Mesh(
          new THREE.SphereGeometry(m.size, 32, 32),
          new THREE.MeshStandardMaterial({
            map: moonTex || null,
            color: moonTex ? 0xffffff : m.color,
            roughness: 1,
            metalness: 0,
            emissive: new THREE.Color(m.color),
            emissiveIntensity: 0.12
          })
        );
        moonMesh.position.x = m.dist;
        moonMesh.userData.id = p.id; // fallback: parent planet
        moonMesh.userData.moonId = m.id;
        moonMesh.userData.moonName = m.name;
        moonMesh.userData.isMoon = true;
        moonPivot.add(moonMesh);
        pickables.push(moonMesh);

        // Larger invisible hit sphere so small moons are easy to click
        const moonHit = new THREE.Mesh(
          new THREE.SphereGeometry(Math.max(m.size * 2.4, 0.28), 12, 12),
          new THREE.MeshBasicMaterial({ visible: false })
        );
        moonHit.position.x = m.dist;
        moonHit.userData.id = p.id;
        moonHit.userData.moonId = m.id;
        moonHit.userData.moonName = m.name;
        moonHit.userData.isMoon = true;
        moonPivot.add(moonHit);
        pickables.push(moonHit);
        // remember mesh for camera follow
        m._mesh = moonMesh;

        // Moon name chip — shown only while this moon is selected
        const moonLabel = makeLabelSprite(m.name);
        moonLabel.position.set(0, m.size + 0.55, 0);
        moonLabel.visible = false;
        moonMesh.add(moonLabel);
        m._label = moonLabel;

        // subtle orbit ring for outer-system moons only (keep inner system clean)
        if (p.id === 'jupiter' || p.id === 'saturn') {
          const pts = new THREE.EllipseCurve(0, 0, m.dist, m.dist, 0, Math.PI * 2).getPoints(48)
            .map(pt => new THREE.Vector3(pt.x, 0, pt.y));
          const o = new THREE.LineLoop(
            new THREE.BufferGeometry().setFromPoints(pts),
            new THREE.LineBasicMaterial({ color: 0x3a4a6a, transparent: true, opacity: 0.28 })
          );
          holder.add(o);
        }

        bodyMoons.push({ pivot: moonPivot, speed: m.speed });
      }

      const label = makeLabelSprite(p.name);
      label.position.set(0, p.size + 0.85, 0);
      holder.add(label);

      // Initial phase spread so planets don't align
      const phase = (seeds[p.id] || 1) * 0.7;
      pivot.rotation.y = phase;

      bodies.set(p.id, {
        data: p,
        mesh,
        cloudMesh,
        pivot,
        holder,
        tiltGroup,
        orbitLine,
        selRing,
        axisLine,
        label,
        angle: phase
      });
    }

    // Asteroid belt (Mars–Jupiter)
    (function addAsteroidBelt() {
      const count = 900;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = 22.2 + Math.random() * 2.8;
        const y = (Math.random() - 0.5) * 0.55;
        pos[i * 3] = Math.cos(a) * r;
        pos[i * 3 + 1] = y;
        pos[i * 3 + 2] = Math.sin(a) * r;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({
        color: 0x8a7f72,
        size: 0.1,
        map: makeStarSpriteTexture(),
        transparent: true,
        opacity: 0.7,
        sizeAttenuation: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        alphaTest: 0.02
      });
      const belt = new THREE.Points(geo, mat);
      system.add(belt);
    })();

    // Ceres — dwarf planet in the belt (not a moon)
    {
      const p = CERES;
      const pivot = new THREE.Group();
      system.add(pivot);
      const pts = new THREE.EllipseCurve(0, 0, p.orbit, p.orbit, 0, Math.PI * 2).getPoints(96)
        .map(pt => new THREE.Vector3(pt.x, 0, pt.y));
      const orbitLine = new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: 0x5a6a7a, transparent: true, opacity: 0.4 })
      );
      pivot.add(orbitLine);

      const holder = new THREE.Group();
      holder.position.x = p.orbit;
      pivot.add(holder);

      const tex = textures.moon || makePlanetTexture(0x8a8580, 'rock', 42);
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(p.size, 48, 48),
        new THREE.MeshStandardMaterial({
          map: tex,
          roughness: 1,
          metalness: 0,
          emissive: new THREE.Color(0x8a8580),
          emissiveIntensity: 0.15
        })
      );
      mesh.userData.id = 'ceres';
      holder.add(mesh);
      pickables.push(mesh);

      // Ceres is not a planet — keep the body clickable but do not show a name label
      const label = null;

      const phase = 1.9;
      pivot.rotation.y = phase;
      bodies.set('ceres', {
        data: p,
        mesh,
        cloudMesh: null,
        pivot,
        holder,
        tiltGroup: holder,
        orbitLine,
        selRing: null,
        axisLine: null,
        label,
        angle: phase
      });
    }

    // ---------- UI ----------
    const infoPanel = document.getElementById('infoPanel');
    const panelBody = document.getElementById('panelBody');
    const panelEyebrow = document.getElementById('panelEyebrow');
    const tooltip = document.getElementById('tooltip');
    const planetNav = document.getElementById('planetNav');
    const speedInput = document.getElementById('speed');
    const speedVal = document.getElementById('speedVal');

    function speedFromSlider(v) {
      // 0→0.05, 50→1.0, 100→8.0
      const t = Math.min(1, Math.max(0, v / 100));
      if (t <= 0.5) {
        const u = t / 0.5;
        return Math.round(0.05 * Math.pow(20, u) * 100) / 100;
      }
      const u = (t - 0.5) / 0.5;
      return Math.round(1 * Math.pow(8, u) * 100) / 100;
    }

    function setSpeedUI(v) {
      timeScale = speedFromSlider(v);
      speedVal.textContent = timeScale.toFixed(timeScale < 1 ? 2 : 1) + '×';
    }
    speedInput.addEventListener('input', () => setSpeedUI(Number(speedInput.value)));
    setSpeedUI(Number(speedInput.value));

    // Nav icons — circular crops from loaded equirect textures
    function makeNavIconDataUrl(planetId, size = 72) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const radius = size / 2;
      ctx.save();
      ctx.beginPath();
      ctx.arc(radius, radius, radius - 1, 0, Math.PI * 2);
      ctx.clip();

      const texKey = planetId === 'sun' ? 'sun' : planetId;
      const img = textures[texKey]?.image;
      if (img && img.width) {
        // Sample a mid-latitude strip so the icon looks like a sphere face
        const srcW = img.width;
        const srcH = img.height;
        const crop = Math.min(srcW * 0.28, srcH * 0.7);
        const sx = srcW * 0.36;
        const sy = srcH * 0.28;
        ctx.drawImage(img, sx, sy, crop, crop, 0, 0, size, size);
        // Soft terminator for a sphere-like feel
        const g = ctx.createRadialGradient(size * 0.35, size * 0.35, size * 0.05, radius, radius, radius);
        g.addColorStop(0, 'rgba(255,255,255,0.12)');
        g.addColorStop(0.55, 'rgba(0,0,0,0)');
        g.addColorStop(1, 'rgba(0,0,0,0.35)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, size, size);
      } else {
        const hex = '#' + (PLANETS.find(p => p.id === planetId)?.color || 0x888888).toString(16).padStart(6, '0');
        ctx.fillStyle = hex;
        ctx.fillRect(0, 0, size, size);
      }
      ctx.restore();
      return c.toDataURL('image/png');
    }

    for (const p of PLANETS) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.title = p.name;
      btn.dataset.id = p.id;
      const iconUrl = makeNavIconDataUrl(p.id, 72);
      btn.innerHTML = `<span class="dot" style="background-image:url('${iconUrl}');color:#${p.color.toString(16).padStart(6, '0')}"></span>`;
      btn.addEventListener('click', () => selectBody(p.id, true));
      planetNav.appendChild(btn);
    }

    function renderPanel(data) {
      panelEyebrow.textContent = data.name
        ? (data.type ? `${data.type} · ${data.name}` : data.name)
        : 'OVERVIEW';
      const colorHex = '#' + data.color.toString(16).padStart(6, '0');
      const facts = Object.entries(data.facts || {})
        .map(([k, v]) => `<div class="stat"><dt>${k}</dt><dd>${v}</dd></div>`)
        .join('');
      const funFacts = (data.funFacts || [])
        .map((t, i) => `<li><span class="ff-i">${i + 1}</span><span>${t}</span></li>`)
        .join('');
      panelBody.innerHTML = `
        <div class="planet-head">
          <span class="planet-swatch" style="background:${colorHex};color:${colorHex}"></span>
          <h2>${data.name}</h2>
        </div>
        <div class="planet-en">${data.en}${data.nickname ? ' · ' + data.nickname : ''}</div>
        ${data.tagline ? `<p class="tagline">${data.tagline}</p>` : ''}
        <p class="planet-desc">${data.desc}</p>
        <div class="section-label">关键数据</div>
        <div class="stats">${facts}</div>
        ${data.compare ? `<div class="compare-box">和地球比一比：${data.compare}</div>` : ''}
        ${funFacts ? `<div class="section-label">你知道吗？</div><ul class="fun-facts">${funFacts}</ul>` : ''}
        ${data.parent ? `<div class="badge">绕${data.parent}运行的卫星</div>`
          : data.id === 'sun' ? '<div class="badge">太阳系质量中心</div>'
          : data.period != null ? `<div class="badge">公转相对地球：${data.period >= 1 ? data.period + ' 年' : (365 * data.period).toFixed(0) + ' 天'}</div>`
          : ''}
      `;
      infoPanel.dataset.mode = 'detail';
      infoPanel.classList.add('open');
      infoPanel.classList.remove('expanded');
      infoPanel.classList.remove('minimized');
      setCloseBtn('×', '关闭');

    function setCloseBtn(icon, title) {
      const btn = document.getElementById('closePanel');
      if (!btn) return;
      btn.textContent = icon;
      btn.title = title;
      btn.setAttribute('aria-label', title);

    function renderOverview() {
      panelEyebrow.textContent = 'OVERVIEW';
      panelBody.innerHTML = `
        <div class="planet-head">
          <span class="planet-swatch" style="background:#5eebff;color:#5eebff"></span>
          <h2>太阳系</h2>

    }

    function setOverviewExpandedLabel() {
      panelEyebrow.textContent = 'OVERVIEW';
      // Mobile expanded: × collapses back to strip (no full close for overview)
      if (isMobileUI()) setCloseBtn('×', '收起');
      else setCloseBtn('×', '关闭');
    }

    /** Shrink cards so orbiting the scene isn't blocked (mobile only). */
    function collapsePanelForCanvas() {
      if (!isMobileUI() || !infoPanel.classList.contains('open')) return;
      if (infoPanel.dataset.mode === 'overview') {
        infoPanel.classList.remove('expanded');
        setOverviewStripLabel();
      } else if (infoPanel.dataset.mode === 'detail') {
        infoPanel.classList.add('minimized');
        setCloseBtn('⌃', '展开');
      }
    }

    function expandPanelFromStrip() {
      if (infoPanel.dataset.mode === 'overview') {
        infoPanel.classList.add('expanded');
        setOverviewExpandedLabel();
      } else if (infoPanel.dataset.mode === 'detail') {
        infoPanel.classList.remove('minimized');
        setCloseBtn('×', '关闭');
      }
    }

    function setSelectedVisual(id) {
      for (const [key, body] of bodies) {
        if (key.startsWith('_')) continue;
        if (key === 'sun') {
          sunLight.intensity = id === 'sun' ? 3.4 : 2.8;
          continue;
        }
        if (!body.orbitLine) continue;
        const on = key === id;
        // Keep orbit neutral — a cyan orbit near the camera reads as a false “selection ring”
        body.orbitLine.material.color.set(on ? 0x6a82a8 : 0x3a4a6a);
        body.orbitLine.material.opacity = on ? 0.7 : (showOrbits ? 0.55 : 0);
        if (body.label) body.label.material.opacity = 0.85;
        if (body.axisLine) body.axisLine.material.opacity = on ? 0.4 : 0;
      }
      planetNav.querySelectorAll('button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.id === id);
      });
    }

    function selectBody(id, focusCam = false, moonId = null) {
      selectedId = id;
      selectedMoonId = moonId;
      const body = bodies.get(id);
      if (!body) return;
      const moon = moonId ? MOON_INDEX.get(moonId) : null;
      if (moon) {
        renderPanel({
          id: moon.id,
          name: moon.name,
          en: moon.en,
          type: moon.type || '卫星',
          color: moon.color,
          nickname: moon.nickname,
          tagline: moon.tagline,
          desc: moon.desc,
          facts: moon.facts,
          funFacts: moon.funFacts,
          compare: moon.compare,
          period: null,
          moon: true,
          parent: moon.parent
        });
      } else {
        renderPanel(body.data);
      }
      setSelectedVisual(id);
      if (focusCam) focusOnBody(body, moon ? moon.id : null);
    }

    function clearSelection() {
      selectedId = null;
      selectedMoonId = null;
      setSelectedVisual(null);
      renderOverview();
    }

    function focusOnBody(body, moonId = null) {
      const moon = moonId ? MOON_INDEX.get(moonId) : null;
      const moonMesh = moon && moon._mesh ? moon._mesh : null;

      // --- Moon: look from outside the planet so the planet does not cover the moon ---
      if (moonMesh && body.mesh) {
        const moonWorld = new THREE.Vector3();
        const planetWorld = new THREE.Vector3();
        moonMesh.getWorldPosition(moonWorld);
        body.mesh.getWorldPosition(planetWorld);

        let outward = moonWorld.clone().sub(planetWorld);
        if (outward.lengthSq() < 1e-6) outward.set(1, 0, 0);
        else outward.normalize();

        const size = moon.size || 0.15;
        const dist = Math.max(3.2, size * 16 + 2.8);
        // Camera beyond the moon, away from the planet; slight elevation
        const endPos = moonWorld.clone()
          .add(outward.clone().multiplyScalar(dist * 0.9));
        endPos.y += dist * 0.35;
        // keep a little lateral offset so the planet sits to the side, not in front
        const side = new THREE.Vector3(-outward.z, 0, outward.x).normalize();
        endPos.add(side.multiplyScalar(dist * 0.25));
        animateCamera(endPos, moonWorld, 1.15);
        return;
      }

      // --- Planet / sun ---
      const world = new THREE.Vector3();
      if (body.mesh) body.mesh.getWorldPosition(world);
      const size = body.data.size || 1;
      const dist = Math.max(10, size * 8 + 8);
      const sunDir = world.clone();
      if (sunDir.lengthSq() < 1e-6) sunDir.set(0, 0, 1);
      else sunDir.normalize();
      const perp = new THREE.Vector3(-sunDir.z, 0, sunDir.x);
      if (perp.lengthSq() < 1e-6) perp.set(1, 0, 0);
      else perp.normalize();
      const endPos = world.clone()
        .sub(sunDir.clone().multiplyScalar(dist * 0.35))
        .add(perp.multiplyScalar(dist * 0.7));
      endPos.y = world.y + dist * 0.4;
      animateCamera(endPos, world, 1.1);
    }

    let camAnim = null;
    function animateCamera(endPos, endTarget, duration = 1) {
      camAnim = {
        t: 0,
        duration,
        fromPos: camera.position.clone(),
        toPos: endPos.clone(),
        fromTarget: controls.target.clone(),
        toTarget: endTarget.clone()
      };
    }

    document.getElementById('closePanel').addEventListener('click', (e) => {
      e.stopPropagation();
      const mode = infoPanel.dataset.mode;
      if (mode === 'overview' && isMobileUI()) {
        if (infoPanel.classList.contains('expanded')) {
          infoPanel.classList.remove('expanded');
          setOverviewStripLabel();
        } else {
          expandPanelFromStrip();
        }
        return;
      }
      if (mode === 'detail' && isMobileUI() && infoPanel.classList.contains('minimized')) {
        expandPanelFromStrip();
        return;
      }
      clearSelection();
    });
    // Tap strip to expand (overview or minimized detail)
    infoPanel.addEventListener('click', (e) => {
      if (!isMobileUI()) return;
      if (e.target.closest('button')) return;
      if (infoPanel.dataset.mode === 'overview' && !infoPanel.classList.contains('expanded')) {
        expandPanelFromStrip();
      } else if (infoPanel.dataset.mode === 'detail' && infoPanel.classList.contains('minimized')) {
        expandPanelFromStrip();
      }
    });
    document.getElementById('btnReset').addEventListener('click', () => {
      animateCamera(new THREE.Vector3(28, 22, 42), new THREE.Vector3(0, 0, 0), 1.1);
      clearSelection();
    });
    document.getElementById('btnPause').addEventListener('click', (e) => {
      paused = !paused;
      e.target.textContent = paused ? '继续' : '暂停';
      e.target.classList.toggle('active', paused);
    });
    document.getElementById('btnOrbits').addEventListener('click', (e) => {
      showOrbits = !showOrbits;
      e.target.classList.toggle('active', showOrbits);
      for (const [key, body] of bodies) {
        if (key.startsWith('_') || key === 'sun') continue;
        const highlighted = key === selectedId;
        body.orbitLine.material.opacity = showOrbits ? (highlighted ? 0.95 : 0.55) : 0;
      }
    });
    document.getElementById('btnLabels').addEventListener('click', (e) => {
      showLabels = !showLabels;
      e.target.classList.toggle('active', showLabels);
      // Visibility is handled each frame (hover can still show a name)
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        document.getElementById('btnPause').click();
      } else if (e.code === 'KeyR') {
        document.getElementById('btnReset').click();
      } else if (e.code === 'Escape') {
        clearSelection();
      }
    });

    // ---------- Picking ----------
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerDown = { x: 0, y: 0 };
    let isDragging = false;
    let dragCollapsedThisGesture = false;
    let lastPickMoon = null;
    let lastPickMoonId = null;
    let selectedMoonId = null;

    canvas.addEventListener('pointerdown', (e) => {
      pointerDown.x = e.clientX;
      pointerDown.y = e.clientY;
      isDragging = false;
      canvas.classList.add('dragging');
      dragCollapsedThisGesture = false;
    });
    canvas.addEventListener('pointerup', (e) => {
      canvas.classList.remove('dragging');
      const dx = e.clientX - pointerDown.x;
      const dy = e.clientY - pointerDown.y;
      // Touch taps are less precise than mouse — larger drag threshold
      const moveSq = dx * dx + dy * dy;
      const dragThresh = (e.pointerType === 'touch') ? 160 : 36;
      if (moveSq > dragThresh) {
        isDragging = true;
        return;
      }
      isDragging = false;
      const hit = pick(e.clientX, e.clientY);
      if (hit.id) selectBody(hit.id, true, hit.moonId);
      else clearSelection();
    });
    canvas.addEventListener('pointermove', (e) => {
      // Collapse cards as soon as a real orbit drag starts (mobile)
      if (!dragCollapsedThisGesture) {
        const dx = e.clientX - pointerDown.x;
        const dy = e.clientY - pointerDown.y;
        const moveSq = dx * dx + dy * dy;
        const dragThresh = (e.pointerType === 'touch') ? 160 : 36;
        if (moveSq > dragThresh) {
          isDragging = true;
          dragCollapsedThisGesture = true;
          collapsePanelForCanvas();
        }
      }
      updatePointer(e.clientX, e.clientY);
      if (isDragging) return;
      const hit = pick(e.clientX, e.clientY);
      hoveredId = hit.id;
      canvas.classList.toggle('hovering', !!hit.id);
      if (hit.id) {
        const data = bodies.get(hit.id).data;
        tooltip.textContent = hit.moonName || data.name;
        tooltip.style.left = e.clientX + 'px';
        tooltip.style.top = e.clientY + 'px';
        tooltip.classList.add('show');
      } else {
        tooltip.classList.remove('show');
      }
      // subtle scale on hover — skip when hovering a moon (planet growth can cover it)
      const hoveringMoon = !!hit.moonId;
      for (const [key, body] of bodies) {
        if (key.startsWith('_') || !body.mesh) continue;
        const target = (!hoveringMoon && (key === hoveredId || key === selectedId) && !selectedMoonId) ? 1.04 : 1;
        body.mesh.scale.lerp(new THREE.Vector3(target, target, target), 0.25);
        if (body.cloudMesh) body.cloudMesh.scale.copy(body.mesh.scale);
      }
    });
    canvas.addEventListener('pointerleave', () => {
      hoveredId = null;
      tooltip.classList.remove('show');
      canvas.classList.remove('hovering');
    });

    function updatePointer(x, y) {
      const rect = canvas.getBoundingClientRect();
      pointer.x = ((x - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((y - rect.top) / rect.height) * 2 + 1;
    }
    function pick(x, y) {
      updatePointer(x, y);
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(pickables, false);
      if (!hits.length) return { id: null, moonId: null, moonName: null };
      const first = hits[0];
      // Always prefer a moon hit if one is anywhere along this ray (moons are small;
      // a slightly larger planet proxy shouldn't steal the click)
      for (const h of hits) {
        if (h.object.userData.isMoon) {
          return {
            id: h.object.userData.id,
            moonId: h.object.userData.moonId || null,
            moonName: h.object.userData.moonName || null
          };
        }
      }
      return { id: first.object.userData.id || null, moonId: null, moonName: null };
    }

    // ---------- Animation loop ----------
    const clock = new THREE.Clock();
    const camTargetWorld = new THREE.Vector3();
    const labelWorld = new THREE.Vector3();

    function tick() {
      const dt = Math.min(clock.getDelta(), 0.05);
      if (!paused) {
        simTime += dt * timeScale;
      }

      // Revolution & rotation — paced so both motions are clearly visible at 1×
      for (const [key, body] of bodies) {
        if (key.startsWith('_') || key === 'sun') continue;
        const p = body.data;
        const dayAbs = Math.abs(p.day) || 1;

        // Revolution: earth ≈ 5s/rev at 1×, outer planets compressed via pow
        // Revolution: earth ≈ 10s/rev at 1× (slower so first-open is easy to follow)
        const orbitPeriod = Math.max(4.5, Math.pow(p.period, 0.45) * 10);
        const orbitSpeed = (Math.PI * 2) / orbitPeriod;

        // Rotation: keep spin readable (not a blur, not a statue)
        let rotPeriod;
        if (dayAbs < 0.5) rotPeriod = 0.55;
        else if (dayAbs < 1.5) rotPeriod = 1.1;
        else if (dayAbs < 10) rotPeriod = 1.6;
        else rotPeriod = 2.4;
        const rotSpeed = (Math.PI * 2) / rotPeriod;
        const dir = p.day < 0 ? -1 : 1;

        if (!paused) {
          body.mesh.rotation.y += dir * rotSpeed * dt * timeScale;
          body.angle += orbitSpeed * dt * timeScale;
          body.pivot.rotation.y = body.angle;
        }
      }
      // sun slow spin
      if (!paused) sunMesh.rotation.y += 0.08 * dt * timeScale;
      // Clouds track the surface almost exactly (tiny lag for life)
      if (bodyMeshExtras.earthClouds && !paused) {
        const cloudSpeed = (Math.PI * 2) / 1.1;
        bodyMeshExtras.earthClouds.rotation.y += cloudSpeed * 0.985 * dt * timeScale;
      }
      // major moons
      if (!paused) {
        for (const moon of bodyMoons) {
          moon.pivot.rotation.y += moon.speed * dt * timeScale * 0.55;
        }
      }

      // Keep labels readable across zoom levels — floor is higher so far view stays legible
      const camPos = camera.position;
      for (const [key, body] of bodies) {
        if (key.startsWith('_') || !body.label) continue;
        body.label.getWorldPosition(labelWorld);
        const d = camPos.distanceTo(labelWorld);
        const s = THREE.MathUtils.clamp(d * 0.016, 0.48, 1.15);
        body.label.scale.set(
          body.label.userData.baseW * s,
          body.label.userData.baseH * s,
          1
        );
        // Labels: planet names only when 标签 is on; selected moon always shows its own name
        if (body.label) {
          // Hide planet chip while a moon is the selected focus
          if (showLabels) {
            const near = d < 18;
            body.label.visible = !near || (key === selectedId && !selectedMoonId);
          } else {
            body.label.visible = key === selectedId && !selectedMoonId;
          }
        }
      }
      // Update moon labels
      for (const m of Object.values(MOONS).flat()) {
        if (!m._label) continue;
        m._label.visible = !!(selectedMoonId && m.id === selectedMoonId);
        if (m._label.visible && m._mesh) {
          m._mesh.getWorldPosition(labelWorld);
          const d = camPos.distanceTo(labelWorld);
          const s = THREE.MathUtils.clamp(d * 0.018, 0.55, 1.1);
          m._label.scale.set(
            m._label.userData.baseW * s,
            m._label.userData.baseH * s,
            1
          );
        }
      }
      headlight.position.copy(camera.position);

      // Camera animation
      if (camAnim) {
        camAnim.t += dt / camAnim.duration;
        const t = Math.min(1, camAnim.t);
        const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        camera.position.lerpVectors(camAnim.fromPos, camAnim.toPos, e);
        controls.target.lerpVectors(camAnim.fromTarget, camAnim.toTarget, e);
        if (t >= 1) camAnim = null;
      } else if (selectedId) {
        // follow selected moon if any, else the planet
        const body = bodies.get(selectedId);
        const m = selectedMoonId ? MOON_INDEX.get(selectedMoonId) : null;
        const follow = (m && m._mesh) ? m._mesh : (body && body.mesh);
        if (follow) {
          follow.getWorldPosition(camTargetWorld);
          controls.target.lerp(camTargetWorld, 0.08);
        }
      }

      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }

    // Resize
    window.addEventListener('resize', () => {
      applyCameraFit(true);
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    window.addEventListener('orientationchange', () => {
      setTimeout(() => {
        applyCameraFit(true);
        renderer.setSize(window.innerWidth, window.innerHeight);
      }, 200);
    });

    // Init UI
    renderOverview();
    setSelectedVisual(null);
    document.getElementById('loader').classList.add('hide');
    tick();
  </script>
</body>
</html>
